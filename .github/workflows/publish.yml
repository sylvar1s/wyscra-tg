name: Publish to npm

# Публикация: создайте Release на GitHub с тегом вида v0.1.0 (версия должна совпадать с package.json).
# Один раз добавьте секрет NPM_TOKEN: Settings → Secrets and variables → Actions → New repository secret.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "Тег $GITHUB_REF_NAME не совпадает с версией в package.json ($PKG)"; exit 1; fi
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
