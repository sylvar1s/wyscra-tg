name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Typecheck examples
        run: npx tsc -p examples/typescript/tsconfig.json

  drivers:
    name: Database drivers (Postgres · MySQL · MongoDB · Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-retries 30
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_MYSQL_URL: mysql://root:test@localhost:3306/test
      TEST_MONGO_URL: mongodb://localhost:27017/test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm skips `install --no-save` for packages listed in our own peerDependencies ("up to date"),
      # so drop them from the CI copy of package.json first.
      - name: Install database drivers
        run: |
          npm pkg delete peerDependencies peerDependenciesMeta
          npm install --no-save pg mysql2 mongodb redis
          for p in pg mysql2 mongodb redis; do test -d "node_modules/$p" || { echo "$p was not installed"; exit 1; }; done
      - run: npm run build
      - run: node --test test/drivers.test.mjs
      - name: Same suite with ioredis instead of node-redis
        run: |
          rm -rf node_modules/redis node_modules/@redis
          npm install --no-save ioredis
          test -d node_modules/ioredis && test ! -d node_modules/redis
          node --test --test-name-pattern=redis test/drivers.test.mjs
